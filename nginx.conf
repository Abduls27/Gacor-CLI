worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # -------------------------------------------------------
    # Satu server block per project Laravel.
    # Duplikat block ini jika punya lebih dari satu project.
    # -------------------------------------------------------

    server {
        listen       80;
        server_name  project-satu.test;

        # Ganti ini ke folder public/ project Laravel kamu
        root   "C:/Users/jb/Kumpulan Project/project-satu/public";

        index  index.php index.html;

        # Laravel pretty URLs
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM via TCP (port 9000)
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;

            # Timeout untuk artisan-style long requests
            fastcgi_read_timeout 300;
        }

        # Blokir akses ke file sensitif
        location ~ /\.(env|git|htaccess) {
            deny all;
        }

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # -------------------------------------------------------
    # Contoh project kedua — uncomment dan sesuaikan
    # -------------------------------------------------------

    # server {
    #     listen       80;
    #     server_name  project-dua.test;
    #     root         "C:/Users/jb/Kumpulan Project/project-dua/public";
